<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GN-Math Todo App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 GN-Math To-Do List</h1>
            <p class="subtitle">Stay organized and track your tasks</p>
        </header>

        <main>
            <div class="input-section">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Add a new task..."
                    autocomplete="off"
                >
                <button id="addBtn" class="add-btn">Add Task</button>
            </div>

            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <div class="stats">
                <span>Total: <strong id="totalCount">0</strong></span>
                <span>Active: <strong id="activeCount">0</strong></span>
                <span>Completed: <strong id="completedCount">0</strong></span>
            </div>

            <ul id="taskList" class="task-list">
                <!-- Tasks will be inserted here -->
            </ul>

            <div class="empty-state" id="emptyState">
                <p>No tasks yet. Add one to get started! 🚀</p>
            </div>

            <button id="clearBtn" class="clear-btn">Clear Completed</button>
        </main>

        <footer>
            <p>Tasks are saved automatically to your browser's local storage</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
